name: CI/CD Pipeline - Perfumora

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  SERVER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/perfumora-server
  CLIENT_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/perfumora-client

jobs:
  # ============================
  # JOB 1: Build & Push to Docker Hub
  # ============================
  build-server:
    name: Build & Push SERVER image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./src/server
          file: ./src/server/Dockerfile
          # PR chỉ build kiểm tra, không đẩy lên Docker Hub (tránh ghi đè :latest)
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-client:
    name: Build & Push CLIENT image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./src/client
          file: ./src/client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            REACT_APP_SERVER_URL=${{ secrets.REACT_APP_SERVER_URL }}
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  # ============================
  # JOB 2: Deploy lên Render.com
  # ============================
  deploy:
    name: Deploy to Render.com
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    # Chỉ deploy khi push lên main (không deploy khi PR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Trigger deploy SERVER trên Render
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}" \
            -X GET \
            --fail \
            && echo "✅ Server deploy triggered" \
            || echo "⚠️  Server deploy hook not configured"

      - name: 🚀 Trigger deploy CLIENT trên Render
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}" \
            -X GET \
            --fail \
            && echo "✅ Client deploy triggered" \
            || echo "⚠️  Client deploy hook not configured"
